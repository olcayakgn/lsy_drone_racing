rpy = [ 0.023396806889919075, -0.025516753641050105, 7.867346653853116,]

[[env.track.obstacles]]
pos = [ 0.7889361234104837, -1.0694559081272907, 1.548292636871338,]

[[env.track.obstacles]]
pos = [ 1.093219095049502, -1.0870106949526188, 1.5514501333236694,]

[[env.track.obstacles]]
pos = [ 1.4033536622969622, -1.0694559081272907, 1.545061469078064,]

[[env.track.obstacles]]
