[controller]
file = "SpatialScenarioMPC_Controller_improved_clean.py"

[deploy]
check_drone_start_pos = true
check_race_track = true
real_track_objects = true
[[deploy.drones]]
id = 52
channel = 80
drone_model = "cf21B_500"

[env]
control_mode = "attitude"
freq = 50
id = "DroneRacing-v0"
seed = -1
sensor_range = 0.7

[sim]
attitude_freq = 500
camera = -1
drone_model = "cf21B_500"
freq = 500
physics = "so_rpy_rotor_drag"
render = true
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [ 0.0, 0.0, 0.0,]

[env.track]
randomize = false
[[env.track.drones]]
pos = [ 2.0060680099665555, -1.081159099344176, 0.02660764753818512,]
rpy = [ -0.028680588932489925, -0.0007952877992940532, 1.5759952585551513,]
vel = [ 0, 0, 0,]
ang_vel = [ 0, 0, 0,]

[[env.track.gates]]
pos = [ -1.7974691355211685, -1.1513782466454878, 1.2252203226089478,]
rpy = [ 0.0067624630278604325, 0.009717464980519619, 1.5442601514568253,]

[[env.track.gates]]
pos = [ -1.0894260668996076, -1.1572298422539307, 0.6772222518920898,]
rpy = [ -0.004664957054747593, -0.005306715261299555, -4.767282344365029,]

[[env.track.gates]]
pos = [ -0.4223441675371453, -1.168933033470816, 1.2162383794784546,]
rpy = [ -0.0032995412739816182, -0.04013325594527006, 1.6219673175846354,]

[[env.track.gates]]
