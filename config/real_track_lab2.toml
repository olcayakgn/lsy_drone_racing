[controller]
file = "MPPI_Controller2.py"

[deploy]
check_drone_start_pos = true
check_race_track = true
real_track_objects = true
[[deploy.drones]]
id = 52
channel = 80
drone_model = "cf21B_500"

[env]
control_mode = "attitude"
freq = 50
id = "DroneRacing-v0"
seed = -1
sensor_range = 0.7

[sim]
attitude_freq = 500
camera = -1
camera_view = [ 5, 180, -25, 0, 0, 0,]
drone_model = "cf21B_500"
freq = 500
physics = "so_rpy_rotor_drag"
render = true
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [ 0.0, 0.0, 0.0,]

[env.track]
randomize = false
[[env.track.drones]]
pos = [ -1.3357837200164795, 0.7725920081138611, 0.023010248318314552,]
rpy = [ -0.01794265006541107, 0.05575455827846376, -0.05371665575341879,]
