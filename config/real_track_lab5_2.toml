[controller]
file = "MPPI_Controller2.py"

[deploy]
check_drone_start_pos = true
check_race_track = true
real_track_objects = true
[[deploy.drones]]
id = 52
channel = 80
drone_model = "cf21B_500"

[env]
control_mode = "attitude"
freq = 50
id = "DroneRacing-v0"
seed = -1
sensor_range = 0.7

[sim]
attitude_freq = 500
camera = -1
camera_view = [5, 180, -25, 0, 0, 0]
drone_model = "cf21B_500"
freq = 500
physics = "so_rpy_rotor_drag"
render = true
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [0.0, 0.0, 0.0]

[env.track]
randomize = false
[[env.track.drones]]
pos = [-0.7090135216712952, 1.0978102684020996, 0.046976182609796524]
rpy = [0.004619301661484387, 0.008516138922130656, -3.1412891866115835]
vel = [0, 0, 0]
ang_vel = [0, 0, 0]

[[env.track.gates]]
pos = [0.9317894577980042, 0.8349741697311401, 0.6727468371391296]
rpy = [-0.008034297271950916, -0.00662799434505712, -0.1440262025503341]

[[env.track.gates]]
pos = [0.8014888167381287, -1.0570718050003052, 1.221373438835144]
rpy = [0.009220397417958548, 0.007400480674604637, 1.5019762671973846]

[[env.track.gates]]
pos = [0.09895434230566025, -0.24967941641807556, 0.667671263217926]
