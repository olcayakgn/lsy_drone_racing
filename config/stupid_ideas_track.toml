[controller]
file = "SpatialScenarioMPC_Controller_improved_clean.py"

[deploy]
check_drone_start_pos = true
check_race_track = true
real_track_objects = true
[[deploy.drones]]
id = 52
channel = 80
drone_model = "cf21B_500"

[env]
control_mode = "attitude"
freq = 50
id = "DroneRacing-v0"
seed = -1
sensor_range = 0.7

[sim]
attitude_freq = 500
camera = -1
drone_model = "cf21B_500"
freq = 500
physics = "so_rpy_rotor_drag"
render = true
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [ 0.0, 0.0, 0.0,]

[env.track]
randomize = false
[[env.track.drones]]
pos = [ -1.9813278008298756, 0.015770697126058497, 0.02660764753818512,]
rpy = [ -0.028680588932489925, -0.0007952877992940532, 0.00519893176025521,]
vel = [ 0, 0, 0,]
ang_vel = [ 0, 0, 0,]

[[env.track.gates]]
